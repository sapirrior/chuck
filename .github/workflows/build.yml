name: Build & Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-version:
    name: Verify Tag & Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check-version.outputs.version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Verify Version Match
        id: check-version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "Tag Version: $TAG"
          echo "Package Version: $PKG_VERSION"
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "::error::Version mismatch! Git tag ($TAG) does not match package.json version ($PKG_VERSION)."
            echo "Please update the version in package.json to match the tag before releasing."
            exit 1
          fi
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"

  build-and-release:
    name: Build Multi-Arch Binaries & Release
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Run Build & Formatting Check
        run: |
          bun run build
          bun run format

      - name: Compile Standalone Binaries
        run: |
          mkdir -p release-assets

          echo "Compiling for Linux x64..."
          bun build --compile --minify --target=bun-linux-x64 ./src/cli.ts --outfile ./bin-linux-x64/chuck
          tar -czf release-assets/chuck-linux-x64.tar.gz -C ./bin-linux-x64 chuck

          echo "Compiling for Linux ARM64..."
          bun build --compile --minify --target=bun-linux-arm64 ./src/cli.ts --outfile ./bin-linux-arm64/chuck
          tar -czf release-assets/chuck-linux-arm64.tar.gz -C ./bin-linux-arm64 chuck

          echo "Compiling for macOS x64..."
          bun build --compile --minify --target=bun-darwin-x64 ./src/cli.ts --outfile ./bin-darwin-x64/chuck
          tar -czf release-assets/chuck-darwin-x64.tar.gz -C ./bin-darwin-x64 chuck

          echo "Compiling for macOS ARM64 (Apple Silicon)..."
          bun build --compile --minify --target=bun-darwin-arm64 ./src/cli.ts --outfile ./bin-darwin-arm64/chuck
          tar -czf release-assets/chuck-darwin-arm64.tar.gz -C ./bin-darwin-arm64 chuck

          echo "Compiling for Windows x64..."
          bun build --compile --minify --target=bun-windows-x64 ./src/cli.ts --outfile ./bin-windows-x64/chuck.exe
          zip -j release-assets/chuck-windows-x64.zip ./bin-windows-x64/chuck.exe

          echo "Packaging Node-compatible bundle..."
          tar -czf release-assets/chuck-dist-cli.tar.gz -C ./dist cli.js

      - name: Generate Checksums
        working-directory: release-assets
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          name: 'Chuck v${{ needs.verify-version.outputs.version }}'
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
